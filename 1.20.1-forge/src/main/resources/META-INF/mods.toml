modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
displayTest="IGNORE_SERVER_VERSION"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
credits="Concept/reference: Mobilelize (Revert-Toggle-Sneak, MIT). Independent implementation for versions without native toggle sneak."

[[dependencies.itamiotogglesneak]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.itamiotogglesneak]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
