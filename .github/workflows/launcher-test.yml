name: Launcher test ToggleSneak

# Boots the real Minecraft client headlessly (HeadlessMC + Xvfb via
# mc-runtime-test) for both 1.20.1 loaders, and boots a real Forge 1.12.2
# dedicated server for the legacy variant. All builds happen in CI only.

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  launcher-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: 1.12.2-forge, java: '8',  gradle: '4.10.3', mc: '1.12.2', loader: forge,  fabric_api: none , jdk: '8.0.442+6' }
          - { variant: 1.20.1-fabric, java: '21', gradle: '9.5.1',  mc: '1.20.1', loader: fabric, fabric_api: 0.92.11 , jdk: '21' }
          - { variant: 1.20.1-forge,  java: '17', gradle: '8.14.5', mc: '1.20.1', loader: forge,  fabric_api: none , jdk: '17' }
          - { variant: 26.3-fabric,  java: '25', gradle: '9.8.2',  mc: '26.3',   loader: fabric, fabric_api: 0.163.0, jdk: '25' }
          - { variant: 1.21.1-fabric,  java: '21', gradle: '9.5.1',  mc: '1.21.1',   loader: fabric, fabric_api: 0.107.0, jdk: '21' }
          - { variant: 1.21.11-fabric,  java: '21', gradle: '9.5.1',  mc: '1.21.11',   loader: fabric, fabric_api: 0.141.6, jdk: '21' }
          - { variant: 26.1.2-fabric,  java: '25', gradle: '9.8.2',  mc: '26.1.2',   loader: fabric, fabric_api: 0.155.3, jdk: '25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build mod in CI
        working-directory: ${{ matrix.variant }}
        run: gradle clean build --no-daemon --stacktrace
      - name: Stage mod for test client/server
        run: |
          mkdir -p run/mods
          cp "${{ matrix.variant }}"/build/libs/togglesneak-*.jar run/mods/
          rm -f run/mods/*-sources.jar
          ls -la run/mods/

      - name: Launch Minecraft ${{ matrix.mc }} client (${{ matrix.loader }})
        if: matrix.variant != '1.12.2-forge'
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          regex: .*${{ matrix.loader }}.*
          mc-runtime-test: ${{ matrix.loader }}
          java: ${{ matrix.java }}
          xvfb: "true"
          fabric-api: ${{ matrix.fabric_api }}
          headlessmc-command: '--jvm "-DMcRuntimeGameTest=false"'

      - name: Boot Forge 1.12.2 dedicated server with the mod
        if: matrix.variant == '1.12.2-forge'
        run: |
          mkdir -p server && cd server
          curl -fsSLO https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2847/forge-1.12.2-14.23.5.2847-installer.jar
          java -jar forge-1.12.2-14.23.5.2847-installer.jar --installServer > install.log 2>&1 || { cat install.log; exit 1; }
          echo "eula=true" > eula.txt
          mkdir -p mods
          cp ../run/mods/*.jar mods/
          echo "=== server directory ==="
          ls -la
          SRV_JAR=$(find . -maxdepth 1 -name 'forge-*.jar' ! -name '*installer*' -print -quit)
          echo "Server jar: $SRV_JAR"
          if [ -z "$SRV_JAR" ]; then echo "FAIL: no Forge server jar produced"; exit 1; fi
          timeout 240 java -jar "$SRV_JAR" nogui > server.log 2>&1 || true
          echo "=== server log tail ==="
          tail -40 server.log
          grep -iE 'Done \(' server.log
          if grep -qiE 'Unable to launch|Mixin apply for .* failed|InvalidMixinException|Crash report|Loading failed|\[.*FATAL\]' server.log; then
            echo "FAIL: server reported a crash"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ToggleSneak-launcher-logs-${{ matrix.variant }}
          path: |
            run/logs/
            server/server.log
            .minecraft/logs/
            **/latest.log
          if-no-files-found: warn
