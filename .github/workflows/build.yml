name: Build ToggleSneak (all variants)

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: 1.12.2-forge, java: '8', gradle: '4.10.3', prefix: togglesneak , jdk: '8.0.442+6' }
          - { variant: 1.20.1-fabric, java: '21', gradle: '9.5.1', prefix: togglesneak , jdk: '21' }
          - { variant: 1.20.1-forge, java: '17', gradle: '8.14.5', prefix: togglesneak , jdk: '17' }
          - { variant: 26.3-fabric, java: '25', gradle: '9.8.2', prefix: togglesneak , jdk: '25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        working-directory: ${{ matrix.variant }}
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify mod JAR
        working-directory: ${{ matrix.variant }}
        run: |
          ls -la build/libs/
          if ! ls build/libs/${{ matrix.prefix }}-*.jar >/dev/null 2>&1; then
            echo "FAIL: mod JAR not found"
            exit 1
          fi
          if ls build/libs/*-sources.jar >/dev/null 2>&1; then
            rm -f build/libs/*-sources.jar
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ToggleSneak-${{ matrix.variant }}
          path: ${{ matrix.variant }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          - { variant: 1.21.1-fabric, java: '21', gradle: '9.5.1', prefix: togglesneak , jdk: '21' }
          - { variant: 1.21.11-fabric, java: '21', gradle: '9.5.1', prefix: togglesneak , jdk: '21' }
          - { variant: 26.1.2-fabric, java: '25', gradle: '9.8.2', prefix: togglesneak , jdk: '25' }
