plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" ; id 'maven-publish' }
version = project.mod_version
group = project.maven_group
base { archivesName = "togglesneak-1.21.11-fabric" }
repositories { }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings loom.officialMojangMappings()
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
 testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
 testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.3"
}
processResources { inputs.property "version", version; filesMatching("fabric.mod.json") { expand "version": version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
test { useJUnitPlatform(); testLogging { events "passed", "failed", "skipped" } }
